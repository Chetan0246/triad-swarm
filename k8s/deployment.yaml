apiVersion: apps/v1
kind: Deployment
metadata:
  name: triad-engine
  namespace: triad-system
  labels:
    app: triad-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: triad-engine
  template:
    metadata:
      labels:
        app: triad-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: triad-engine
          image: triad-swarm:0.3.0
          imagePullPolicy: IfNotPresent
          command: ["triad", "serve", "--host", "0.0.0.0", "--port", "8000", "--log-format", "json"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: triad-config
            - secretRef:
                name: triad-secrets
                optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: triad-cache-storage
              mountPath: /app/.triad_cache
            - name: triad-out-storage
              mountPath: /app/out
      volumes:
        - name: triad-cache-storage
          emptyDir: {}
        - name: triad-out-storage
          emptyDir: {}
