services:
  triad-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triad-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TRIAD_LOG_FORMAT=json
      - TRIAD_CONCURRENCY=8
      - RIVER_API_KEY=${RIVER_API_KEY:-}
      - RIVER_API_BASE=${RIVER_API_BASE:-https://api.river.ai/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - triad-cache:/app/.triad_cache
      - triad-out:/app/out
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - triad-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: triad-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - triad-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: triad-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=triadadmin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - triad-net

networks:
  triad-net:
    driver: bridge

volumes:
  triad-cache:
  triad-out:
  prom-data:
  grafana-data:
