[project]
name = "triad-swarm"
version = "0.3.0"
description = "Minimal-Agent, Maximum-Speed, Minimum-Token Multi-Agent Swarm Framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Chetan" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "uvicorn>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/Chetan0246/triad-swarm"
Repository = "https://github.com/Chetan0246/triad-swarm"
Documentation = "https://github.com/Chetan0246/triad-swarm#readme"
Issues = "https://github.com/Chetan0246/triad-swarm/issues"

[project.scripts]
triad = "triad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triad"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
