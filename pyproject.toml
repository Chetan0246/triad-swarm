[project]
name = "triad-swarm"
version = "0.2.0"
description = "Minimal-Agent, Maximum-Speed, Minimum-Token Multi-Agent Swarm Framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
]

[project.scripts]
triad = "triad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triad"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
